name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run the tests
        run: python -m pytest -q tests
      - name: Validate the Neuro-SAN agent network
        run: ns validate registries/complaintrouter.hocon
        env:
          PYTHONPATH: ${{ github.workspace }}
          AGENT_TOOL_PATH: complaint_tools
      - name: Evaluate the router on the labelled test set
        run: python examples/evaluate_router.py
